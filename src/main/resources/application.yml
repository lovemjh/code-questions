server:
  port: 8080

spring:
  application:
    name: personnel-management

  # 文件上传限制（标签导入 CSV）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # H2 文件数据库（数据持久化到 ./data 目录）
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:file:./data/personnel;MODE=MySQL
    username: sa
    password:

  # H2 控制台: http://localhost:8080/h2-console (JDBC URL 同上)
  h2:
    console:
      enabled: true
      path: /h2-console

  # 启动时执行 schema.sql / data.sql（建表与内置 mock 演示数据，脚本幂等可重复执行）
  sql:
    init:
      mode: always
      encoding: utf-8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

# JWT 配置
jwt:
  secret: personnel-management-secret-key-2024
  expiration: 86400000  # 24小时

# 外部人员同步接口业务 Token（请求头 X-Sync-Token；环境变量 SYNC_API_TOKEN 覆盖；
# 为空时同步接口整体禁用，杜绝"空 Token 匹配空请求头"穿透）
sync:
  api:
    token: ${SYNC_API_TOKEN:}
